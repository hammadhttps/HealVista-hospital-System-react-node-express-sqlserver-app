services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medicore
      POSTGRES_PASSWORD: medicore
      POSTGRES_DB: medicore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicore"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # allkeys-lru + a maxmemory cap so a long-lived dev box evicts stale cache
    # instead of filling up and refusing writes. Applies to local Redis only —
    # Upstash's eviction policy is a plan property (see README "Redis on the free tier").
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
