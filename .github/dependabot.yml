version: 2

updates:
  # Root workspace (npm workspaces resolves apps/* and packages/* from here)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Keep related packages on matching versions — a lone @types bump
      # against an unbumped runtime package just breaks the build.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tanstack:
        patterns: ['@tanstack/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      dev-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Majors get reviewed deliberately, not merged by a bot.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    labels: ['dependencies']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['ci']
